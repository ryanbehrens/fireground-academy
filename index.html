<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0c0b">
<meta name="description" content="Firefighter I & II training: drills, flashcards, picture ID, scenarios and timed mock exams.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FF Training">
<title>Firefighter Training — FF1 &amp; FF2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0c0b;--panel:#1a1614;--panel2:#231d1a;--line:#382d28;--text:#f6eee8;--mute:#a8988c;
  --fire:#ff5a1f;--fire2:#ffb020;--red:#d7263d;--ok:#2ec27e;--bad:#ef4444;--blue:#3b82f6;--water:#5ec8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -200px,#3a160a 0%,transparent 70%),var(--bg)}
#embers{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1,h2,h3,.disp{font-family:Oswald,Impact,sans-serif;letter-spacing:.02em;text-transform:uppercase;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--fire2)}
/* header */
header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background:rgba(14,12,11,.82);border-bottom:1px solid var(--line)}
.hbar{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-family:Oswald;font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.logo svg{width:28px;height:28px}
.logo small{color:var(--fire2);font-size:12px;display:block;line-height:1;letter-spacing:.12em}
.spacer{flex:1}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:linear-gradient(180deg,var(--fire),#d8410e);color:#fff;box-shadow:0 2px 10px rgba(255,90,31,.4)}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
/* generic */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:12px;font-weight:700;font-size:15px;background:var(--panel2);border:1px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ff6a2a,#d63c0a);border-color:#ff7a3d;color:#fff;box-shadow:0 6px 22px rgba(255,90,31,.35)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mute{color:var(--mute)}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;color:var(--mute)}
.chip.on{border-color:var(--fire);color:#fff;background:rgba(255,90,31,.16)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-weight:600;font-size:14px;padding:16px 0 6px}
.view{animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* home */
.hero{padding:28px 0 18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hero h1{font-size:clamp(34px,7vw,56px);line-height:.95}
.hero h1 span{background:linear-gradient(90deg,var(--fire2),var(--fire),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);margin:10px 0 0;max-width:460px}
.ring{width:118px;height:118px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{font-family:Oswald;font-size:28px;display:block;line-height:1}
.ring small{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-family:Oswald;font-size:24px;display:block}
.stat span{font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mode{position:relative;overflow:hidden;text-align:left;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:18px;min-height:132px;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:#5a463c}
.mode .ic{font-size:30px;line-height:1}
.mode h3{font-size:20px;margin:10px 0 4px}
.mode p{margin:0;color:var(--mute);font-size:13.5px;line-height:1.4}
.mode .tag{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:rgba(255,176,32,.14);color:var(--fire2)}
.mode.exam{grid-column:1/-1;min-height:170px;background:linear-gradient(120deg,#5c130a 0%,#2a0f09 55%,var(--panel) 100%);border-color:#7a2a16}
.mode.exam h3{font-size:30px}
.mode.exam .truck{position:absolute;right:-10px;bottom:-6px;width:240px;opacity:.95}
.lights{position:absolute;inset:0;pointer-events:none;background:radial-gradient(160px 80px at 82% 30%,rgba(255,40,40,.25),transparent 70%);animation:strobe 1.4s infinite}
@keyframes strobe{0%,49%{opacity:1}50%,100%{opacity:.15}}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.sec-title h2{font-size:20px}
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.tp .n{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.tp .n i{font-style:normal;color:var(--mute);font-weight:500}
.bar{height:6px;border-radius:9px;background:#2d2421;margin-top:8px;overflow:hidden}
.bar>div{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--fire2),var(--fire))}
/* practice */
.pbar{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.pbar h2{font-size:22px}
.pill{font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.heat{display:flex;gap:2px;align-items:flex-end;height:22px}
.heat i{width:7px;border-radius:3px;background:#3a2c26;transition:all .3s}
.heat i.on{background:linear-gradient(0deg,var(--red),var(--fire),var(--fire2));box-shadow:0 0 8px rgba(255,120,30,.6)}
.qcard{padding:22px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qmeta span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:#2d2421;color:var(--mute)}
.qmeta span.lv{background:rgba(255,90,31,.15);color:var(--fire2)}
.qtext{font-size:clamp(18px,3.2vw,22px);font-weight:600;line-height:1.4}
.banner{font-size:13px;font-weight:600;color:var(--fire2);background:rgba(255,176,32,.08);border:1px dashed rgba(255,176,32,.35);padding:8px 12px;border-radius:10px;margin-bottom:14px}
.art-wrap{display:grid;place-items:center;background:#120f0e;border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.art{width:100%;max-width:260px;height:auto}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 14px;border-radius:12px;background:var(--panel);border:1.5px solid var(--line);font-size:16px;line-height:1.35;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:#6a5246}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:13px;background:#2d2421;color:var(--mute)}
.opt.right{border-color:var(--ok);background:rgba(46,194,126,.12)}
.opt.right .k{background:var(--ok);color:#06281a}
.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.12);animation:shake .35s}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.picked{border-color:var(--fire);background:rgba(255,90,31,.14)}
.opt.picked .k{background:var(--fire);color:#fff}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.explain{margin-top:16px;padding:14px;border-radius:12px;background:#151211;border:1px solid var(--line);animation:rise .3s}
.explain h4{margin:0 0 6px;font-family:Oswald;text-transform:uppercase;letter-spacing:.04em;font-size:16px}
.explain h4.ok{color:var(--ok)} .explain h4.no{color:var(--bad)}
.explain p{margin:0;line-height:1.5;color:#e2d6cd}
.watch{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:700;text-decoration:none;color:#fff;background:#3a1d14;border:1px solid #6b2c18;padding:7px 11px;border-radius:9px}
.think-box{margin-top:16px}
.think-box textarea{width:100%;min-height:80px;background:#151211;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;font:inherit;resize:vertical}
.think-hint{font-size:13px;color:var(--mute);margin:8px 0 12px}
.clock{position:relative;width:44px;height:44px}
.clock svg{transform:rotate(-90deg)}
.clock b{position:absolute;inset:0;display:grid;place-items:center;font-family:Oswald;font-size:15px}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:60;background:linear-gradient(180deg,#ff6a2a,#c2380a);padding:10px 18px;border-radius:999px;font-family:Oswald;font-size:18px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 10px 30px rgba(255,90,31,.5);animation:pop 1.6s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
/* flashcards */
.flip{perspective:1200px;margin-top:6px}
.flip-in{position:relative;min-height:320px;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:26px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line)}
.face.front{background:linear-gradient(160deg,#2a201c,#181412)}
.face.backf{background:linear-gradient(160deg,#3b170c,#1c100c);transform:rotateY(180deg);border-color:#6b2c18}
.face .ft{font-size:clamp(19px,3.4vw,24px);font-weight:600;line-height:1.4}
.face .ans{font-family:Oswald;font-size:clamp(22px,4vw,30px);color:var(--fire2);text-transform:none;line-height:1.2;margin-bottom:12px}
.face .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.face .art{max-width:170px;margin:0 auto 10px}
.fc-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn.again{border-color:#6b2a2a;background:#2a1414}
.btn.got{border-color:#1f6b47;background:#11281d}
/* study hub */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mode .cnt{margin-top:10px;font-size:12px;font-weight:700;color:var(--fire2)}
/* exam */
.ex-top{display:flex;align-items:center;gap:10px;margin:12px 0 8px}
.fuse{position:relative;height:10px;border-radius:9px;background:#2a211e;margin:4px 0 16px;overflow:visible}
.fuse .burn{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#5a1d0c,var(--fire),var(--fire2))}
.fuse .spark{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--fire2) 35%,rgba(255,90,31,0) 70%);animation:spark .25s infinite alternate}
@keyframes spark{to{transform:scale(1.5);opacity:.75}}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:16px}
.navgrid button{height:36px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--mute);position:relative}
.navgrid button.ans{background:#3a1d14;border-color:#6b2c18;color:#fff}
.navgrid button.cur{outline:2px solid var(--fire2)}
.navgrid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--fire2)}
.ex-nav{display:flex;gap:10px;margin-top:16px}
.ex-nav .btn{flex:1}
.flagbtn.on{border-color:var(--fire2);color:var(--fire2)}
/* overlays */
.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden}
.dispatch{background:#000}
.strobe{position:absolute;inset:0;animation:rb .5s steps(1) infinite}
@keyframes rb{0%{background:radial-gradient(70% 60% at 15% 0%,rgba(255,0,30,.55),transparent 70%)}50%{background:radial-gradient(70% 60% at 85% 0%,rgba(30,90,255,.55),transparent 70%)}}
.dsp-text{position:relative;text-align:center;padding:20px}
.dsp-line{font-family:Oswald;text-transform:uppercase;letter-spacing:.08em;opacity:0;transform:translateY(14px);animation:rise .4s forwards}
.dsp-line.l1{font-size:14px;color:var(--fire2);letter-spacing:.3em}
.dsp-line.l2{font-size:clamp(36px,9vw,72px);font-weight:700;line-height:1;margin:10px 0;color:#fff;text-shadow:0 0 30px rgba(255,60,20,.7)}
.dsp-line.l3{font-size:18px;color:#ddd}
.count{font-family:Oswald;font-size:clamp(120px,30vw,220px);font-weight:700;color:#fff;text-shadow:0 0 50px var(--fire),0 0 100px var(--red);animation:countIn .9s ease-out forwards}
@keyframes countIn{0%{transform:scale(2.4);opacity:0}30%{opacity:1;transform:scale(1)}100%{transform:scale(.85);opacity:0}}
.skip{position:absolute;bottom:26px;right:22px;color:#aaa;font-size:13px;font-weight:600;border:1px solid #444;padding:7px 12px;border-radius:999px}
.flames{position:absolute;left:0;right:0;bottom:-30px;height:200px;display:flex;justify-content:center;gap:0;pointer-events:none}
.fl{width:90px;height:90px;margin:0 -18px;border-radius:50% 0 50% 50%;transform:rotate(-45deg);background:linear-gradient(-45deg,var(--fire2),var(--fire) 50%,var(--red));filter:blur(2px);animation:flick 1.1s ease-in-out infinite alternate;transform-origin:50% 50%;opacity:.9;align-self:flex-end;transition:all 1.4s ease}
.fl:nth-child(2n){height:130px;width:110px;animation-duration:.8s}
.fl:nth-child(3n){height:160px;width:120px;animation-duration:1.3s}
@keyframes flick{0%{transform:rotate(-45deg) scale(1)}100%{transform:rotate(-41deg) scale(1.12) translateY(-6px)}}
.flames.out .fl{transform:rotate(-45deg) scale(.1)!important;opacity:0;filter:blur(8px)}
.steam{position:absolute;bottom:40px;width:60px;height:60px;border-radius:50%;background:rgba(220,230,240,.25);filter:blur(10px);animation:steam 2.4s ease-out forwards}
@keyframes steam{from{opacity:0;transform:translateY(0) scale(.6)}30%{opacity:1}to{opacity:0;transform:translateY(-260px) scale(2.4)}}
.drop{position:absolute;top:-20px;width:4px;height:22px;border-radius:4px;background:linear-gradient(180deg,transparent,var(--water));animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh)}}
/* results */
.res-hero{position:relative;overflow:hidden;text-align:center;padding:34px 18px 190px;border-radius:22px;border:1px solid var(--line);margin-top:14px;background:linear-gradient(180deg,#1d1311,#120c0b)}
.res-hero>*:not(.flames):not(.drop):not(.steam){position:relative;z-index:2}
.res-hero .flames{height:150px;opacity:.85}
.res-hero.pass{background:linear-gradient(180deg,#0f2a2a,#0b1416);border-color:#1e5050}
.badge{display:inline-block;font-family:Oswald;font-size:clamp(28px,7vw,46px);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 18px;border:3px solid currentColor;border-radius:10px;transform:rotate(-4deg) scale(0);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:1.6s}
@keyframes stamp{to{transform:rotate(-4deg) scale(1)}}
.score-big{font-family:Oswald;font-size:clamp(64px,16vw,110px);font-weight:700;line-height:1;margin:14px 0 4px}
.tbreak{display:grid;gap:8px;margin-top:12px}
.tbreak .r{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center;font-size:13px}
.review-item{padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-top:10px}
.review-item .yours{color:var(--bad);font-size:14px;margin-top:6px}
.review-item .corr{color:var(--ok);font-size:14px;margin-top:4px}
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:20px}
.modal{max-width:380px;width:100%}
.empty{text-align:center;padding:40px 20px}
@media (max-width:620px){
  .grid,.mgrid{grid-template-columns:1fr}
  .topics{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .ring{display:none}
  .logo{font-size:16px}
  .mode.exam .truck{width:170px;opacity:.5}
}
</style>
</head>
<body>
<canvas id="embers"></canvas>
<header>
  <div class="hbar">
    <button class="logo" onclick="go('home')">
      <svg viewBox="0 0 32 32"><path d="M16 2c2 5 7 7 7 14a7 7 0 1 1-14 0c0-3 1-5 3-7 0 3 1 4 2 5 0-5 1-8 2-12z" fill="url(#lg)"/><defs><linearGradient id="lg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d7263d"/><stop offset=".55" stop-color="#ff5a1f"/><stop offset="1" stop-color="#ffb020"/></linearGradient></defs></svg>
      <div><span class="full">Firefighter</span><small>Training</small></div>
    </button>
    <div class="spacer"></div>
    <div class="seg" id="lvlSeg">
      <button data-l="1">FF1</button><button data-l="2">FF2</button><button data-l="all">Both</button>
    </div>
    <button class="icon-btn" id="installBtn" title="Install app" style="display:none">⬇</button>
    <button class="icon-btn" id="soundBtn" title="Sound"></button>
  </div>
</header>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   QUESTION BANK  — correct answer is ALWAYS listed first in
   the data; options are shuffled every time they're shown.
   ========================================================= */
const Q=[];
function add(lv,t,q,c,e,x){Q.push(Object.assign({lv,t,q,c,e},x||{}))}

/* ---------- FF1: Fire Behavior ---------- */
add(1,'Fire Behavior','What are the four components of the fire tetrahedron?',['Fuel, heat, oxygen, and a self-sustaining chemical chain reaction','Fuel, heat, oxygen, and smoke','Fuel, heat, water, and oxygen','Heat, oxygen, carbon, and nitrogen'],'The fire triangle (fuel, heat, oxygen) became the tetrahedron when the uninhibited chemical chain reaction was added. Remove any one side and the fire goes out — that is the basis of every extinguishing method.');
add(1,'Fire Behavior','Heat transferred through direct contact between materials is called:',['Conduction','Convection','Radiation','Direct flame impingement'],'Conduction is heat moving through a solid or between objects that are touching, such as a steel beam carrying heat into the next room.');
add(1,'Fire Behavior','Heat carried by the circulation of a heated gas or liquid (such as smoke rising up a stairwell) is:',['Convection','Conduction','Radiation','Ionization'],'Convection moves heat through fluids — hot smoke and gases rising and spreading across ceilings is the classic fireground example.');
add(1,'Fire Behavior','A house across the street ignites even though no flames or smoke reached it. The heat most likely traveled by:',['Radiation','Conduction','Convection','Pyrolysis'],'Radiant heat travels as electromagnetic waves in straight lines and does not need a medium — the reason exposure protection matters.');
add(1,'Fire Behavior','What is the correct order of the stages of fire development in a compartment?',['Incipient, growth, fully developed, decay','Growth, incipient, decay, fully developed','Incipient, flashover, growth, decay','Ignition, decay, growth, fully developed'],'Incipient (ignition) → growth → fully developed → decay. Flashover is a transition that can occur between growth and fully developed — it is not a stage itself.');
add(1,'Fire Behavior','Flashover is best described as:',['The rapid transition to a state where all exposed combustible surfaces in a compartment ignite almost at once','A smoke explosion caused by introducing air into an oxygen-starved space','Flames rolling across the ceiling in the hot gas layer','The point at which a liquid gives off enough vapor to ignite'],'Flashover happens when radiant heat from the upper layer brings everything in the room to its ignition temperature nearly simultaneously. It is generally not survivable, even in full PPE.');
add(1,'Fire Behavior','Flames appearing in the hot gas layer at the ceiling, ahead of the main fire, are called:',['Rollover (flameover)','Backdraft','Flashover','Smoke explosion'],'Rollover/flameover is the ignition of unburned fuel gases in the upper layer. It is a warning sign that flashover may follow.');
add(1,'Fire Behavior','You arrive at a tightly closed commercial building. Which observation MOST strongly warns of a possible backdraft?',['Pressurized smoke puffing from cracks, with smoke-stained windows and little visible flame','Heavy flame venting from the roof','Light white smoke drifting from the eaves','Occupants waving from a second-floor window'],'Backdraft conditions are an oxygen-starved, superheated space: puffing or "breathing" smoke, stained/blackened windows, little visible flame, and air being drawn in when an opening is made.',{best:1});
add(1,'Fire Behavior','When water is converted to steam at 212°F (100°C), it expands approximately:',['1,700 times','170 times','17 times','17,000 times'],'This expansion is what makes water so effective at absorbing heat and displacing oxygen — and why too much steam in a small room can burn crews and occupants.');
add(1,'Fire Behavior','A gas with a vapor density LESS than 1 will:',['Rise in air','Sink and collect in low areas','Mix evenly and stay at mid-height','Dissolve in water'],'Air has a vapor density of 1. Gases lighter than 1 (like natural gas/methane) rise; heavier gases (like propane) sink to low spots.');
add(1,'Fire Behavior','A liquid with a specific gravity GREATER than 1 will:',['Sink in water','Float on water','Evaporate immediately','Mix completely with water'],'Water has a specific gravity of 1. Heavier liquids sink beneath water; lighter ones such as gasoline float — which is why water alone can spread a gasoline fire.');
add(1,'Fire Behavior','The flash point of a liquid is the minimum temperature at which it:',['Gives off enough vapor to ignite momentarily, but not sustain burning','Will sustain continuous combustion','Ignites without any outside ignition source','Begins to boil'],'Flash point = momentary flash. Fire point (slightly higher) = sustained burning. Autoignition temperature = ignites with no outside source.');
add(1,'Fire Behavior','Which toxic gas, released by burning plastics and synthetics, prevents the body from using oxygen at the cellular level?',['Hydrogen cyanide (HCN)','Carbon dioxide (CO₂)','Nitrogen','Water vapor'],'HCN is a chemical asphyxiant common in modern fires. Carbon monoxide (CO) is the other major killer — it binds to hemoglobin far more readily than oxygen.');

/* ---------- FF1: Safety & SCBA ---------- */
add(1,'Safety & SCBA','The "two-in, two-out" rule requires that when two firefighters enter an IDLH atmosphere:',['At least two properly equipped firefighters remain outside, ready to rescue them','Two hoselines must be charged before entry','Only two firefighters may enter at a time','Two officers must approve the entry'],'This comes from the OSHA respiratory protection standard (29 CFR 1910.134). The outside pair exists to rescue the inside crew.');
add(1,'Safety & SCBA','IDLH stands for:',['Immediately Dangerous to Life or Health','Incident Danger Level: High','Interior Danger, Limited Hazard','Initial Defensive Line Hold'],'An IDLH atmosphere is one that poses an immediate threat to life or would cause irreversible health effects — SCBA is required.');
add(1,'Safety & SCBA','Under current NFPA 1981 requirements, the SCBA end-of-service-time (low-air) alarm activates when the cylinder is down to about:',['33% of its capacity','50% of its capacity','25% of its capacity','10% of its capacity'],'The threshold was raised from 25% to 33% to give firefighters more time to exit. Plan your exit well before the alarm — the alarm is not a "start leaving" signal.');
add(1,'Safety & SCBA','A PASS device sounds a full alarm when the firefighter has been motionless for about:',['30 seconds','5 seconds','2 minutes','5 minutes'],'PASS = Personal Alert Safety System. It gives a pre-alert, then a loud full alarm after about 30 seconds of no movement. It can also be activated manually.');
add(1,'Safety & SCBA','In the Mayday acronym LUNAR, what do the letters stand for?',['Location, Unit, Name, Assignment/Air, Resources needed','Lost, Unable, Need, Air, Rescue','Location, Urgency, Number, Air, Radio','Lift, Unclip, Notify, Activate, Retreat'],'LUNAR gives command exactly what the RIT needs to find you: where you are, your unit, your name, your assignment and air supply, and what you need.',{v:'firefighter mayday LUNAR training'});
add(1,'Safety & SCBA','You are separated from your partner, low on air, and cannot find the exit. What should you do FIRST?',['Call a Mayday immediately','Keep searching silently for the exit to avoid tying up the radio','Remove your facepiece to conserve air','Wait for your low-air alarm before calling for help'],'Call the Mayday early. The single biggest factor in firefighter rescue is how quickly the Mayday is called. Then activate your PASS, control your breathing, and try to self-rescue.',{best:1});
add(1,'Safety & SCBA','PAR stands for:',['Personnel Accountability Report','Primary Attack Route','Pressure And Rate','Protective Air Reserve'],'A PAR is a roll call confirming every member of every crew is accounted for — done at set intervals, after major changes, and after any Mayday or evacuation.');
add(1,'Safety & SCBA','The main purpose of a Rapid Intervention Crew/Team (RIC/RIT) is to:',['Stand by, fully equipped, to rescue lost, trapped, or injured firefighters','Perform the initial fire attack','Set up the water supply','Search for civilian victims'],'The RIC is dedicated to firefighter rescue. They size up the building, stage tools, and are ready the moment a Mayday is called.');
add(1,'Safety & SCBA','During overhaul the fire is out and the smoke is light. What should you do with your SCBA?',['Keep wearing it — CO and other toxic gases are still present','Remove it, since the visible smoke is gone','Switch to a paper dust mask','Remove it only if you feel dizzy'],'Overhaul atmospheres are often loaded with carbon monoxide, cyanide, and carcinogens even when the air looks clear. Stay on air until monitoring shows it is safe.',{best:1});

/* ---------- FF1: Extinguishers ---------- */
add(1,'Extinguishers','Class B fires involve:',['Flammable and combustible liquids and gases','Ordinary combustibles such as wood and paper','Energized electrical equipment','Combustible metals'],'Class A — ordinary combustibles. B — flammable liquids/gases. C — energized electrical. D — combustible metals. K — cooking oils and fats.');
add(1,'Extinguishers','Which class of fire involves cooking oils and fats in commercial kitchens?',['Class K','Class B','Class D','Class A'],'Class K extinguishers use a wet chemical agent that saponifies (turns to a soapy foam) on contact with hot oil, smothering it.');
add(1,'Extinguishers','A fire in magnesium shavings at a machine shop is a:',['Class D fire','Class A fire','Class B fire','Class C fire'],'Combustible metals (magnesium, titanium, sodium, etc.) burn extremely hot and can react violently with water. Use a Class D dry powder agent.');
add(1,'Extinguishers','The acronym for operating a portable extinguisher, PASS, stands for:',['Pull, Aim, Squeeze, Sweep','Push, Aim, Spray, Stop','Pull, Approach, Squeeze, Spray','Point, Activate, Squeeze, Sweep'],'Pull the pin, Aim at the base of the fire, Squeeze the handle, Sweep side to side.',{v:'how to use a fire extinguisher PASS'});

/* ---------- FF1: Ropes & Knots ---------- */
add(1,'Ropes & Knots','Which knot forms a secure loop that will not slip or tighten under load and is easy to untie?',['Bowline','Clove hitch','Half hitch','Becket bend'],'The bowline is the go-to knot for a fixed loop: it holds under load yet unties easily afterward.',{v:'firefighter bowline knot'});
add(1,'Ropes & Knots','The clove hitch is mainly used to:',['Attach a rope to an object, such as a pole or a tool for hoisting','Join two ropes of different diameters','Form a non-slip loop around a victim','Back up another knot'],'The clove hitch is quick to tie around an object and is used in hoisting tools like pike poles and axes.',{v:'firefighter clove hitch hoisting axe'});
add(1,'Ropes & Knots','Which knot is used to join two ropes of unequal diameter?',['Becket (sheet) bend','Bowline','Figure-eight on a bight','Clove hitch'],'The becket/sheet bend is designed for joining ropes of different sizes.');
add(1,'Ropes & Knots','The purpose of an overhand safety knot is to:',['Keep the loose end of a rope from slipping back through the main knot','Join two ropes together','Create a rescue loop','Shorten a rope'],'A safety (overhand) knot is tied with the tail after the main knot to back it up.');
add(1,'Ropes & Knots','A life safety rope that has been subjected to an impact load should be:',['Removed from service','Inspected and returned to service if no damage is visible','Used only for utility purposes from then on','Washed and dried before reuse'],'NFPA 1983 requires life safety rope that has been impact-loaded (or fails inspection) to be removed from life-safety service — internal damage may not be visible.');
add(1,'Ropes & Knots','The part of the rope used to tie the knot is called the:',['Working end','Standing part','Running end','Bight'],'Working end — ties the knot. Running end — used for work like hoisting. Standing part — the section between the two.');

/* ---------- FF1: Ladders ---------- */
add(1,'Ladders','The proper climbing angle for a ground ladder is approximately:',['75 degrees','60 degrees','45 degrees','85 degrees'],'At 75° the ladder has good strength and stability. A quick check: stand at the butt with toes against the beams, arms straight out — your palms should reach the rung.');
add(1,'Ladders','A good rule of thumb for butt placement is a distance from the building equal to:',['One-fourth of the ladder\'s working length','One-half of the working length','One-tenth of the working length','The same as the working length'],'For a 24-foot working length, set the butt about 6 feet from the building — giving roughly the 75° climbing angle.');
add(1,'Ladders','The rope used to raise and lower the fly section of an extension ladder is the:',['Halyard','Guide','Pawl','Truss block'],'The halyard runs over a pulley to raise the fly. Pawls (dogs) are the locks that hold the fly in place on the rungs.');
add(1,'Ladders','The devices that lock the fly section of an extension ladder in place are called:',['Pawls (dogs)','Butt spurs','Heel plates','Stops'],'Pawls hook over the rungs of the bed section. Always confirm they are locked before climbing.');
add(1,'Ladders','When a ground ladder is used to access a roof, it should extend:',['Several rungs (about 3 to 5) above the roof edge','Exactly even with the roof edge','At least 10 feet above the roof','Just below the gutter'],'Extending past the edge gives a handhold for getting on/off and makes the ladder visible in smoke.');

/* ---------- FF1: Hose & Streams ---------- */
add(1,'Hose & Streams','In a forward hose lay, hose is laid from:',['The water source toward the fire','The fire toward the water source','The attack engine to a second engine','The fire to the RIC staging area'],'Forward lay: hydrant → fire (engine stops at the hydrant first). Reverse lay: fire → hydrant.');
add(1,'Hose & Streams','The standard operating nozzle pressure for a smooth-bore nozzle on a handline is:',['50 psi','100 psi','80 psi','150 psi'],'Smooth bore: 50 psi on handlines, 80 psi on master streams. Standard fog nozzles: 100 psi (some low-pressure fog nozzles are designed for 50–75 psi).');
add(1,'Hose & Streams','A standard fog nozzle is designed to operate at:',['100 psi','50 psi','80 psi','200 psi'],'Most standard fog/combination nozzles are rated at 100 psi. Low-pressure designs exist, so know your department\'s nozzles.');
add(1,'Hose & Streams','Water hammer is most commonly caused by:',['Opening or closing a nozzle or valve too quickly','Using hose that is too long','Pumping at too low a pressure','Kinks in a hoseline'],'Sudden changes in flow create a pressure surge that can damage hose, couplings, pumps, and mains. Open and close nozzles and valves slowly.');
add(1,'Hose & Streams','The three types of fire streams are:',['Solid, fog, and broken','Straight, master, and booster','Direct, indirect, and combination','Low, medium, and high pressure'],'Solid streams come from smooth bores; fog streams from fog nozzles; broken streams from devices like cellar nozzles and piercing nozzles.');

/* ---------- FF1: Water Supply ---------- */
add(1,'Water Supply','A dry-barrel hydrant is used in areas where:',['Temperatures drop below freezing','Water pressure is very high','There is no municipal water supply','Hydrants are frequently vandalized'],'The main valve of a dry-barrel hydrant sits below the frost line, and the barrel drains after use so it cannot freeze.');
add(1,'Water Supply','Residual pressure is:',['The pressure remaining in the system while water is flowing','The pressure in the system when no water is flowing','The pressure at the nozzle tip','The pressure lost to friction in the hose'],'Static = no flow. Residual = what is left while flowing. Flow (velocity) pressure = forward pressure at the discharge opening.');

/* ---------- FF1: Ventilation ---------- */
add(1,'Ventilation','Positive pressure ventilation (PPV) works by:',['Using a blower to make pressure inside the building higher than outside, pushing smoke out an exhaust opening','Pulling smoke out with a fan placed in a window','Cutting a hole in the roof directly over the fire','Using a fog stream to draw smoke out a window'],'PPV places a fan outside the entry point to pressurize the structure. It needs a properly sized exhaust opening and coordination with fire attack.');
add(1,'Ventilation','When using hydraulic ventilation, the fog pattern should cover about:',['85–90% of the window opening, with the nozzle about 2 feet back inside','25% of the opening, with the nozzle outside','100% of the opening with a straight stream','Half of the opening, nozzle at the sill'],'A wide fog pattern covering most of the opening, nozzle about 2 ft inside, creates a venturi effect that draws smoke and heat out.');
add(1,'Ventilation','Before a ventilation opening is made on an active fire, the MOST important thing is to:',['Coordinate with the attack crew so a charged hoseline is in position','Open as many windows as possible','Wait for the fire to self-vent','Shut down the water supply'],'Ventilation introduces air (oxygen). Uncoordinated ventilation can cause rapid fire growth or flashover. Vent with the attack, not ahead of it.',{best:1});
add(1,'Ventilation','Vertical ventilation is most effective when the opening is made:',['Directly over the fire, as high as possible','At the lowest floor of the building','On the windward side at ground level','As far from the fire as possible'],'Heat and smoke rise. An opening directly over the fire lets them escape and pulls the fire up toward the vent rather than spreading laterally.');

/* ---------- FF1: Forcible Entry ---------- */
add(1,'Forcible Entry','A flat-head axe paired with a Halligan bar is commonly called:',['The irons','A forcible entry kit','The married set','A pry set'],'"The irons" are the most common forcible entry combination: the axe drives the Halligan, and together they handle most doors.');
add(1,'Forcible Entry','Before forcing any door, firefighters should FIRST:',['Try the door to see if it is unlocked ("try before you pry")','Break the nearest window','Remove the hinges','Call for a K-12 saw'],'An unlocked door saves time and damage. Always check the knob — and feel/read the door for heat before opening.',{best:1});

/* ---------- FF1: Search & Rescue ---------- */
add(1,'Search & Rescue','A primary search is:',['A rapid but thorough search for victims, done before or during fire attack','A slow, detailed search after the fire is under control','A search of the exterior of the building','A search conducted only by the RIC'],'Primary = fast and thorough while conditions are bad. Secondary = slow and meticulous after the fire is controlled, ideally by a different crew.');
add(1,'Search & Rescue','When searching a burning house for victims, which area should generally be searched FIRST?',['The area closest to the fire, then the rest of the fire floor','The basement, regardless of fire location','The attic','The rooms farthest from the fire'],'Victims nearest the fire are in the most immediate danger. Priority: fire area → rest of fire floor → floor above → other floors.',{best:1});
add(1,'Search & Rescue','During an oriented or wall search, firefighters keep contact with the wall mainly so they can:',['Stay oriented and retrace their path back out','Feel for heat in the walls','Move faster than crawling in the open','Locate electrical outlets'],'Keep the same hand on the wall going in (right- or left-hand search) and reverse it to come out the way you went in.');

/* ---------- FF1: Building Construction ---------- */
add(1,'Building Construction','Type V construction is:',['Wood frame — structural members made entirely or partly of wood','Fire-resistive','Heavy timber','Noncombustible'],'Type I fire-resistive, Type II noncombustible, Type III ordinary (masonry walls, wood interior), Type IV heavy timber, Type V wood frame.');
add(1,'Building Construction','Type IV construction is commonly known as:',['Heavy timber','Ordinary','Wood frame','Fire-resistive'],'Large-dimension wood members char slowly, giving heavy timber buildings significant structural endurance — but they can produce enormous fire loads.');
add(1,'Building Construction','Why are lightweight truss roofs and floors a major fireground hazard?',['They can fail early in a fire, often with little or no warning','They make ventilation impossible','They are always made of steel and conduct heat','They prevent water from reaching the fire'],'Lightweight wood or steel trusses have little mass. When one member fails, the whole system can collapse quickly — sometimes within minutes of fire exposure.');

/* ---------- FF1: Hazmat ---------- */
add(1,'Hazmat','In the Emergency Response Guidebook (ERG), the GREEN pages provide:',['Initial isolation and protective action distances','An index of materials by ID number','An index of materials by name','Response guides for each material'],'Yellow = by ID number. Blue = by material name. Orange = the guides (hazards and actions). Green = isolation and protective action distances for toxic inhalation hazards.',{v:'how to use the ERG emergency response guidebook'});
add(1,'Hazmat','The ORANGE section of the ERG contains:',['The response guides describing hazards and recommended actions','The list of materials by ID number','Table of protective action distances','Placard images'],'Find the material in yellow (ID) or blue (name), which sends you to a guide number in orange.');
add(1,'Hazmat','When approaching a hazardous materials incident, responders should approach from:',['Uphill and upwind','Downhill and downwind','Directly downwind to monitor the vapors','Whichever direction is fastest'],'Uphill and upwind keeps vapors, liquids, and smoke flowing away from you. Stay back and use binoculars to identify the material.',{best:1});

/* ---------- FF1: Communications & ICS ---------- */
add(1,'Communications & ICS','The recommended span of control in the Incident Command System is:',['3 to 7 subordinates, with 5 being optimal','10 to 15 subordinates','1 to 2 subordinates','Unlimited, as long as radios are used'],'ICS keeps span of control manageable: one supervisor for 3–7 people or units, ideally 5.');
add(1,'Communications & ICS','A "Mayday" radio call is used when:',['A firefighter is lost, trapped, injured, or out of air and needs help','Command needs to change tactics','A crew is reporting completion of an assignment','Any urgent message must be sent'],'Mayday is reserved for a firefighter in trouble. Many departments use "Emergency Traffic" for other urgent messages like evacuation.');

/* ---------- FF1: Fire Protection Systems ---------- */
add(1,'Fire Protection Systems','An outside stem and yoke (OS&Y) valve is OPEN when:',['The stem is visible and extended out of the yoke','The stem is not visible','The handle is pointing down','The chain is locked'],'"Stem out = water out." When the stem is mostly hidden, the valve is closed.',{v:'OS&Y valve open closed firefighter'});
add(1,'Fire Protection Systems','The fire department connection (FDC) on a building is used to:',['Pump water into the sprinkler or standpipe system to support it','Supply water to the engine from the building','Shut off the sprinkler system','Test the fire alarm'],'Engines connect to the FDC to boost pressure and volume for sprinklers or standpipes.');
add(1,'Fire Protection Systems','The quickest way to stop water flowing from a single activated sprinkler is to:',['Insert a sprinkler wedge or stopper into the head','Close the main water valve to the building','Break the remaining sprinkler heads','Pull the fire alarm'],'A wedge or stopper stops one head fast. Close the system control valve only when ordered, and post a firefighter at the valve.');

/* ---------- FF1: Salvage & Overhaul ---------- */
add(1,'Salvage & Overhaul','Overhaul is the process of:',['Searching for and extinguishing hidden or remaining fire','Protecting property from water and smoke damage','Ventilating a structure','Restoring hose to the apparatus'],'Overhaul is about preventing rekindle: opening walls and ceilings, using thermal imagers, and checking for hidden fire.');
add(1,'Salvage & Overhaul','Salvage operations are intended to:',['Reduce property damage from fire, smoke, and water','Find the cause of the fire','Locate trapped victims','Extinguish hidden fire in walls'],'Salvage includes covering contents with salvage covers, removing water, and protecting valuables — often started during the fire attack itself.');

/* ---------- FF2: Foam ---------- */
add(2,'Foam','The four elements of the foam tetrahedron are:',['Foam concentrate, water, air, and mechanical agitation','Foam, fuel, heat, and oxygen','Concentrate, eductor, nozzle, and hose','Water, air, heat, and pressure'],'All four are needed to make finished foam: concentrate + water = foam solution; add air and agitation = finished foam.');
add(2,'Foam','The bank-down (bounce-off) method of applying foam means:',['Deflecting the foam stream off a wall or object so it flows gently onto the fuel','Lobbing the foam high into the air above the fuel','Applying foam on the ground in front of the spill so it rolls across','Plunging the stream directly into the fuel'],'Bank-down: off a vertical surface. Roll-on: onto the ground in front. Rain-down: lofted over the fuel. Never plunge foam into burning liquid.',{v:'foam application roll-on bank-down rain-down'});
add(2,'Foam','An in-line eductor works by:',['Using the venturi principle to draw foam concentrate into the water stream','Pumping concentrate under pressure into the hose','Mixing foam in a premix tank','Adding compressed air to the foam'],'Water passing through a restriction creates low pressure that pulls concentrate up through the pickup tube. Nozzle and eductor flow ratings must match.');
add(2,'Foam','A "3%" foam concentrate is proportioned at:',['3 parts concentrate to 97 parts water','3 parts water to 97 parts concentrate','3 gallons of concentrate per minute','3% air in the finished foam'],'Class B concentrates are commonly 1%, 3%, or 6%. Class A foam is usually proportioned well under 1%.');
add(2,'Foam','A fire involving a polar solvent such as alcohol requires:',['Alcohol-resistant foam (such as AR-AFFF)','Standard protein foam','Class A foam','Plain water fog only'],'Polar solvents mix with water and break down regular foams. Alcohol-resistant foams form a protective membrane between the fuel and the foam blanket.');

/* ---------- FF2: Vehicle Extrication ---------- */
add(2,'Vehicle Extrication','After scene size-up and hazard control at a vehicle collision, what should happen BEFORE gaining access to the patient?',['Stabilize the vehicle','Remove the roof','Pop the doors with hydraulic tools','Cut the battery cables'],'An unstable vehicle can shift and injure the patient or rescuers. Stabilize with cribbing, step chocks, or struts before any disentanglement.',{best:1});
add(2,'Vehicle Extrication','On hybrid and electric vehicles, high-voltage cables are typically colored:',['Orange','Blue','Green','Yellow'],'Never cut orange high-voltage cables. Shut the vehicle off, chock it, and follow manufacturer emergency response guides.');
add(2,'Vehicle Extrication','The "5-10-20" rule for undeployed airbags refers to safe distances (in inches) for:',['Side, driver, and passenger airbags','Front, rear, and roof airbags','Bumper, door, and seat airbags','Cribbing heights'],'Stay at least 5" from side, 10" from driver, and 20" from passenger airbags. Never place yourself or tools in the deployment path.');

/* ---------- FF2: Fire Investigation ---------- */
add(2,'Fire Investigation','At the FF2 level, a firefighter\'s main responsibility for fire cause is to:',['Protect the scene, preserve evidence, and report observations','Determine the legal cause of the fire','Interview and arrest suspects','Remove evidence to the station for safekeeping'],'FF2 assists the investigation by protecting the scene and evidence and documenting what they saw — determination of cause belongs to qualified investigators.');
add(2,'Fire Investigation','The chain of custody is:',['A documented record of everyone who handled a piece of evidence','The order in which hoselines were placed','The command structure at the incident','The sequence of fire spread'],'A broken chain of custody can make evidence inadmissible in court. Minimize handling and document everything.');
add(2,'Fire Investigation','Which observation should a firefighter report to investigators?',['Unusual odors, multiple separate fires, or doors and windows already open on arrival','Which hose sizes were used','How long overhaul took','The color of the apparatus'],'Arrival observations — people leaving the scene, unusual odors, multiple points of fire, forced doors, blocked fire protection systems — are valuable and fleeting.',{best:1});

/* ---------- FF2: Flammable Gas ---------- */
add(2,'Flammable Gas','BLEVE stands for:',['Boiling Liquid Expanding Vapor Explosion','Burning Liquid Emits Volatile Energy','Basic Liquid Evaporation Vent Event','Blast Level Evacuation Vapor Estimate'],'A BLEVE occurs when flame heats a pressurized container, especially above the liquid level, weakening the metal until it fails catastrophically.');
add(2,'Flammable Gas','When approaching a burning pressurized LPG tank, firefighters should approach:',['From the sides, at right angles to the tank','From the ends of the tank','From directly downwind','From whichever direction has the most cover from the ends'],'Tanks often rocket from their ends when they fail. Approach from the sides and apply large volumes of water to the vapor space where flame impinges.',{best:1});
add(2,'Flammable Gas','Compared with air, natural gas and LPG (propane) behave as follows:',['Natural gas is lighter and rises; LPG is heavier and collects in low areas','Both are lighter than air','Both are heavier than air','Natural gas is heavier; LPG is lighter'],'Natural gas (methane) rises. LPG sinks into basements, ditches, and low spots — a major hidden hazard.');
add(2,'Flammable Gas','Burning gas is escaping from a broken outdoor supply line. Generally, the BEST action is to:',['Protect exposures and let it burn until the gas can be shut off','Extinguish the flame immediately with a fog stream','Stuff rags into the break','Cover the break with dirt'],'Extinguishing escaping gas creates an unburned vapor cloud that can find another ignition source and explode. Control exposures and shut off the gas.',{best:1});

/* ---------- FF2: Incident Command ---------- */
add(2,'Communications & ICS','A brief initial radio report using the "CAN" format covers:',['Conditions, Actions, Needs','Command, Assignment, Notification','Crew, Air, Number','Call, Arrival, Notice'],'Conditions (what you see), Actions (what you\'re doing), Needs (resources you require) — a clear, fast progress report.');
add(2,'Communications & ICS','The preferred method of transferring command is:',['Face-to-face','By radio','By text message','Through dispatch'],'Face-to-face transfer (or by radio if necessary) should include the situation, hazards, resources assigned, and the incident action plan.');

/* ---------- FF2: Prevention & Pre-Incident ---------- */
add(2,'Prevention & Public Ed','Smoke alarms in a home should generally be replaced:',['Every 10 years','Every year','Every 25 years','Only when they stop working'],'Test monthly, replace batteries as needed, and replace the entire unit at 10 years (or as the manufacturer recommends).');
add(2,'Prevention & Public Ed','Photoelectric smoke alarms generally respond faster than ionization alarms to:',['Slow, smoldering fires','Fast, flaming fires','Cooking steam','Carbon monoxide'],'Ionization alarms are a bit quicker on fast flaming fires; photoelectric alarms on smoldering fires. Combination alarms or both types are recommended.');
add(2,'Prevention & Public Ed','A key part of a home fire escape plan is:',['Two ways out of every room and an outside meeting place','Gathering valuables before leaving','Hiding in a closet until firefighters arrive','Using the elevator in an apartment building'],'Know two ways out, practice the plan twice a year, close doors behind you, and meet at a set spot outside.');
add(2,'Prevention & Public Ed','The main purpose of a pre-incident survey is to:',['Gather information about a building to plan the response before an emergency','Issue code violations to the owner','Determine insurance values','Train building occupants'],'Pre-incident plans document access, hazards, utilities, fire protection systems, and occupancy details so crews arrive informed.');

/* ---------- FF2: Water supply / systems ---------- */
add(2,'Water Supply','During a hydrant flow test, a pitot tube and gauge are used to measure:',['The velocity (flow) pressure of water leaving the hydrant outlet','Static pressure in the water main','The friction loss in a supply line','The depth of the water main'],'The pitot reading is converted to gallons per minute and, along with static and residual pressures, used to calculate available water.');
add(2,'Fire Protection Systems','A Class I standpipe system is designed for:',['Fire department use, with 2½-inch hose connections','Occupant use with 1½-inch hose','Both fire department and occupant use','Sprinkler system testing only'],'Class I: 2½" for FD. Class II: 1½" for occupants/trained staff. Class III: both.');

/* ---------- PICTURE QUESTIONS ---------- */
add(1,'Fire Behavior','Look at the diagram. What belongs in the missing (center) piece?',['Chemical chain reaction','Smoke','Water','Carbon dioxide'],'Fuel, heat, and oxygen form the triangle; the uninhibited chemical chain reaction completes the tetrahedron. Dry chemical and halogenated agents work by interrupting the chain reaction.',{img:'tetra'});
add(1,'Fire Behavior','On this time–temperature curve, which stage of fire is happening at point X?',['Fully developed','Incipient','Growth','Decay'],'At the plateau, all available fuel in the compartment is burning and heat release is at its peak — the fully developed stage.',{img:'curve'});

const $=s=>document.querySelector(s); const app=$('#app');
const store={get(k,d){try{const v=localStorage.getItem('fga_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('fga_'+k,JSON.stringify(v))}catch(e){}}};
let stats=store.get('stats',{}); let prefs=Object.assign({lvl:'all',sound:true,topic:'All',timer:0},store.get('prefs',{})); let exams=store.get('exams',[]);
const savePrefs=()=>store.set('prefs',prefs);
function key(q){let h=0;for(const ch of q.q)h=(h*31+ch.charCodeAt(0))|0;return 'k'+h}
function record(q,ok){const k=key(q);const s=stats[k]||{s:0,c:0};s.s++;if(ok)s.c++;s.last=ok?1:0;stats[k]=s;store.set('stats',stats)}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lvlOK=q=>prefs.lvl==='all'||String(q.lv)===prefs.lvl;
const topicOK=q=>prefs.topic==='All'||q.t===prefs.topic;
const pool=f=>Q.filter(q=>lvlOK(q)&&(!f||f(q)));
const topics=()=>[...new Set(pool().map(q=>q.t))];
const mastered=q=>{const s=stats[key(q)];return s&&s.c>=2&&s.last===1};
const weak=q=>{const s=stats[key(q)];return s&&(s.last===0||s.c/s.s<.6)};
const ytLink=q=>`https://www.youtube.com/results?search_query=${encodeURIComponent(q.v||VID[q.t]||q.t+' firefighter training')}`;
let cleanup=[]; function clearTimers(){cleanup.forEach(f=>f());cleanup=[]}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}

/* --- sound (Web Audio, created on first click) --- */
let AC=null;
function tone(f,d,type='sine',vol=.08,when=0){if(!prefs.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+when+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+d+.05)}catch(e){}}
const sfx={ok(){tone(660,.12,'triangle');tone(990,.18,'triangle',.07,.09)},no(){tone(150,.28,'sawtooth',.05)},
 tones(){tone(853,1,'sine',.09,0);tone(960,1.1,'sine',.09,1)},
 siren(){if(!prefs.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';g.gain.value=.03;o.frequency.setValueAtTime(600,AC.currentTime);for(let i=0;i<4;i++){o.frequency.linearRampToValueAtTime(1150,AC.currentTime+.45+i*.9);o.frequency.linearRampToValueAtTime(600,AC.currentTime+.9+i*.9)}g.gain.setValueAtTime(.03,AC.currentTime+3.4);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+3.7);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+3.8)}catch(e){}},
 win(){[523,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.08,i*.12))},lose(){tone(220,.4,'triangle',.07);tone(165,.6,'triangle',.07,.3)}};

   HOME
   ========================================================= */
function home(){
  const P=pool(),seen=P.filter(q=>stats[key(q)]),m=P.filter(mastered).length;

  const acc=tot?Math.round(cor/tot*100):0,pct=P.length?m/P.length:0,C=2*Math.PI*50,last=exams[exams.length-1];

function runPractice(cfg){
  clearTimers();

  let deck=shuffle(cfg.items.slice()),i=0,right=0,done=0,streak=0,best=0;
  function show(){
    clearTimers();
    if(i>=deck.length){if(cfg.endless){deck=shuffle(deck);i=0}else return finish()}
    const q=deck[i],opts=shuffle(q.c.map((t,j)=>({t,ok:j===0})));let answered=false,revealed=!cfg.think;
    const heat=Array.from({length:10},(_,k)=>`<i class="${k<Math.min(streak,10)?'on':''}" style="height:${8+k*1.4}px"></i>`).join('');
    app.innerHTML=`<div class="view">${backBtn(cfg.back)}

    <div class="row" style="margin-bottom:12px"><span class="pill">${cfg.endless?'#'+(done+1):(i+1)+' / '+deck.length}</span><span class="pill">✅ ${right}/${done}</span><span class="pill" title="Heat streak" style="display:flex;align-items:center;gap:8px">🔥 ${streak}<span class="heat">${heat}</span></span></div>
    <div class="card qcard">${cfg.banner?`<div class="banner">${cfg.banner}</div>`:''}
     <div class="qmeta"><span class="lv">FF${q.lv}</span><span>${esc(q.t)}</span>${q.img?'<span>Picture</span>':''}</div>
     <div class="qtext">${esc(q.q)}</div>${q.img?`<div class="art-wrap">${ART[q.img]()}</div>`:''}
     <div id="thinkArea">${cfg.think?`<div class="think-box"><textarea id="guess" placeholder="Type your answer (optional) — or just say it out loud…"></textarea><div class="think-hint">Commit to an answer before you look. Retrieval practice is what makes it stick.</div><button class="btn primary block" id="reveal">I've got my answer — show options</button></div>`:''}</div>
     <div class="opts" id="opts" style="${revealed?'':'display:none'}">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
     <div id="fb"></div></div></div>`;
    const startClock=()=>{if(!cfg.timer)return;const T=cfg.timer*1000,t0=Date.now();const id=setInterval(()=>{const left=Math.max(0,T-(Date.now()-t0));const cr=$('#cr'),ct=$('#ct');if(!cr){clearInterval(id);return}cr.style.strokeDashoffset=113.1*(1-left/T);cr.style.stroke=left<5000?'#ef4444':'#ff5a1f';ct.textContent=Math.ceil(left/1000);if(left<=0){clearInterval(id);if(!answered)pick(-1)}},100);cleanup.push(()=>clearInterval(id))};
    if(cfg.think){$('#reveal').onclick=()=>{const g=$('#guess').value.trim();$('#thinkArea').innerHTML=g?`<div class="banner" style="margin-top:14px;color:#ddd">Your answer: <b>${esc(g)}</b></div>`:'';$('#opts').style.display='';startClock()}}else startClock();
    function pick(k){if(answered)return;answered=true;clearTimers();const ok=k>=0&&opts[k].ok;
      document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(opts[j].ok)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
      done++;record(q,ok);if(ok){right++;streak++;best=Math.max(best,streak);sfx.ok();if(streak%5===0)toast(`🔥 ${streak} in a row!`)}else{streak=0;sfx.no()}
      $('#fb').innerHTML=`<div class="explain"><h4 class="${ok?'ok':'no'}">${ok?'Correct':(k<0?'Time\'s up':'Not quite')} — ${esc(q.c[0])}</h4><p>${esc(q.e)}</p><a class="watch" href="${ytLink(q)}" target="_blank" rel="noopener">▶ Watch it on YouTube</a></div><button class="btn primary block" style="margin-top:14px" id="next">Next →</button>`;
      $('#next').onclick=()=>{i++;show()};$('#next').scrollIntoView({behavior:'smooth',block:'nearest'})}

  }
  function finish(){const p=Math.round(right/done*100);app.innerHTML=`<div class="view">${backBtn(cfg.back)}<div class="card empty"><div style="font-size:50px">${p>=70?'🏆':'🧯'}</div><h2 style="font-size:34px;margin:8px 0">${p}%</h2><p class="mute">${right} of ${done} correct · best streak ${best}</p><div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="again">Run it again</button><button class="btn" onclick="go('weakspots')">Review weak spots</button></div></div></div>`;$('#again').onclick=()=>runPractice(cfg);if(p>=70)sfx.win()}
  show();

function dispatchAnim(then){

  document.body.appendChild(ov);sfx.tones();

function runExam(qs){
  current={view:'exam'};
  const items=qs.map(q=>({q,opts:shuffle(q.c.map((t,j)=>({t,ok:j===0})))})),n=items.length,ans=Array(n).fill(null),flag=Array(n).fill(false),T=n*60*1000,t0=Date.now();let idx=0,finished=false;
  const tick=setInterval(()=>{const left=T-(Date.now()-t0);const b=$('#burn'),s=$('#spark'),tt=$('#tleft');if(left<=0){clearInterval(tick);submit(true);return}if(!b)return;const f=left/T*100;b.style.width=f+'%';s.style.left=f+'%';const m=Math.floor(left/60000),sec=Math.floor(left/1000)%60;tt.textContent=`${m}:${String(sec).padStart(2,'0')}`;tt.style.color=left<60000?'var(--bad)':''},250);
  cleanup.push(()=>clearInterval(tick));
  function render(){

    app.innerHTML=`<div class="view" style="animation:none">

     <div class="opts">${it.opts.map((o,k)=>`<button class="opt ${ans[idx]===k?'picked':''}" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
     <div class="ex-nav"><button class="btn" id="prev" ${idx===0?'disabled style="opacity:.4"':''}>← Prev</button><button class="btn flagbtn ${flag[idx]?'on':''}" id="flag">⚑ ${flag[idx]?'Flagged':'Flag'}</button>${idx<n-1?'<button class="btn primary" id="nxt">Next →</button>':'<button class="btn primary" id="sub">Submit</button>'}</div></div>
    <div class="navgrid">${items.map((_,k)=>`<button class="${ans[k]!==null?'ans':''} ${k===idx?'cur':''} ${flag[k]?'flag':''}" data-j="${k}">${k+1}</button>`).join('')}</div>
    <button class="btn block ghost" id="sub2" style="margin-top:14px;color:var(--mute)">Submit exam</button></div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[idx]=+b.dataset.k;tone(520,.06,'triangle',.04);if(idx<n-1){setTimeout(()=>{idx++;render()},180)}render()});
    $('#prev').onclick=()=>{if(idx>0){idx--;render()}};$('#flag').onclick=()=>{flag[idx]=!flag[idx];render()};

  }
  function confirmSubmit(){const un=ans.filter(x=>x===null).length,fl=flag.filter(Boolean).length;const m=document.createElement('div');m.className='modal-bg';
    m.innerHTML=`<div class="card modal"><h2 style="font-size:24px">Submit exam?</h2><p class="mute">${un?`<b style="color:var(--bad)">${un} unanswered.</b> `:''}${fl?`${fl} flagged. `:''}${!un&&!fl?'Every question is answered.':''}</p><div class="row"><button class="btn" id="mc" style="flex:1">Keep working</button><button class="btn primary" id="ms" style="flex:1">Submit</button></div></div>`;
    document.body.appendChild(m);m.querySelector('#mc').onclick=()=>m.remove();m.querySelector('#ms').onclick=()=>{m.remove();submit(false)}}
  function submit(timeout){if(finished)return;finished=true;clearTimers();const used=Date.now()-t0;results(items,ans,used,timeout)}
  render();
}
function results(items,ans,used,timeout){
  current={view:'results'};
  const n=items.length,score=items.filter((it,k)=>ans[k]!==null&&it.opts[ans[k]].ok).length,pct=Math.round(score/n*100),pass=pct>=70;
  items.forEach((it,k)=>record(it.q,ans[k]!==null&&it.opts[ans[k]].ok));
  exams.push({d:Date.now(),n,pct,l:prefs.lvl});exams=exams.slice(-30);store.set('exams',exams);
  const bt={};items.forEach((it,k)=>{const t=it.q.t;bt[t]=bt[t]||{n:0,c:0};bt[t].n++;if(ans[k]!==null&&it.opts[ans[k]].ok)bt[t].c++});
  const missed=items.map((it,k)=>({it,k})).filter(({it,k})=>!(ans[k]!==null&&it.opts[ans[k]].ok));
  const mm=Math.floor(used/60000),ss=Math.floor(used/1000)%60;
  app.innerHTML=`<div class="view"><div class="res-hero ${pass?'pass':''}" id="rh">
   <div class="disp" style="font-size:13px;letter-spacing:.24em;color:${pass?'var(--water)':'var(--fire2)'}">${timeout?'Time expired':'Exam complete'}</div>
   <div class="score-big" id="sc">0%</div><div class="mute">${score} of ${n} correct · ${mm}m ${ss}s</div>
   <div style="margin-top:18px"><span class="badge" style="color:${pass?'var(--water)':'var(--fire)'}">${pass?'Fire knocked down':'Rekindle'}</span></div>
   <p style="margin:14px auto 0;max-width:380px;color:#d9ccc4">${pass?'Solid work. You hit the 70% pass mark. Keep drilling the topics below to make it automatic.':'Not quite at 70% yet. Review your misses below, hit Weak Spots, and re-attack.'}</p>
   <div class="flames" id="rf">${'<div class="fl"></div>'.repeat(12)}</div></div>
  <div class="row" style="margin-top:14px"><button class="btn primary" style="flex:1" onclick="go('examSetup')">↻ New exam</button><button class="btn" style="flex:1" onclick="go('weakspots')">🎯 Weak spots</button></div>
  <div class="sec-title"><h2>By topic</h2></div><div class="card tbreak">${Object.entries(bt).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([t,v])=>`<div class="r"><div><div style="display:flex;justify-content:space-between"><span>${esc(t)}</span><span class="mute">${v.c}/${v.n}</span></div><div class="bar"><div style="width:${v.c/v.n*100}%;${v.c/v.n<.7?'background:linear-gradient(90deg,#7a1d1d,var(--bad))':''}"></div></div></div><b style="text-align:right">${Math.round(v.c/v.n*100)}%</b></div>`).join('')}</div>
  <div class="sec-title"><h2>Review misses (${missed.length})</h2></div>
  ${missed.map(({it,k})=>`<div class="review-item"><div class="qmeta"><span class="lv">Q${k+1}</span><span>${esc(it.q.t)}</span></div><b>${esc(it.q.q)}</b><div class="yours">✗ Your answer: ${ans[k]===null?'(blank)':esc(it.opts[ans[k]].t)}</div><div class="corr">✓ ${esc(it.q.c[0])}</div><p class="mute" style="font-size:14px;line-height:1.5;margin:8px 0 0">${esc(it.q.e)}</p></div>`).join('')||'<div class="card mute">Perfect score — nothing to review! 🔥</div>'}</div>`;
  let c=0;const st=setInterval(()=>{c+=Math.max(1,Math.round(pct/30));if(c>=pct){c=pct;clearInterval(st)}const e=$('#sc');if(e)e.textContent=c+'%'},30);cleanup.push(()=>clearInterval(st));
  const rh=$('#rh');
  if(pass){const t1=setTimeout(()=>{for(let i=0;i<70;i++){const d=document.createElement('div');d.className='drop';d.style.left=Math.random()*100+'%';d.style.animationDuration=(.7+Math.random()*.6)+'s';d.style.animationDelay=Math.random()*.9+'s';rh.appendChild(d)}
      setTimeout(()=>{$('#rf')&&$('#rf').classList.add('out');for(let i=0;i<8;i++){const s=document.createElement('div');s.className='steam';s.style.left=(8+i*11)+'%';s.style.animationDelay=i*.12+'s';rh.appendChild(s)}sfx.win()},700)},300);cleanup.push(()=>clearTimeout(t1))}
  else{const t2=setTimeout(sfx.lose,600);cleanup.push(()=>clearTimeout(t2))}
}

/* =========================================================
   EMBER BACKGROUND
   ========================================================= */
(function(){const cv=$('#embers'),cx=cv.getContext('2d');let W,H,P=[];const R=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};R();addEventListener('resize',R);
 const mk=()=>({x:Math.random()*W,y:H+10,r:Math.random()*2+.6,vy:-(Math.random()*.6+.25),vx:(Math.random()-.5)*.3,l:0,L:400+Math.random()*500,h:20+Math.random()*25});
 for(let i=0;i<38;i++){const p=mk();p.y=Math.random()*H;P.push(p)}
 (function f(){cx.clearRect(0,0,W,H);for(const p of P){p.x+=p.vx+Math.sin(p.l/40)*.2;p.y+=p.vy;p.l++;const a=Math.max(0,1-p.l/p.L);cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fillStyle=`hsla(${p.h},100%,60%,${a*.75})`;cx.shadowBlur=8;cx.shadowColor='#ff6a1f';cx.fill();if(p.l>p.L||p.y<-10)Object.assign(p,mk())}requestAnimationFrame(f)})()})();

/* =========================================================
   PWA: service worker + install
   ========================================================= */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
let deferredPrompt=null;const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn').style.display='grid'});
if(isIOS&&!standalone)$('#installBtn').style.display='grid';
$('#installBtn').onclick=async()=>{
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice.catch(()=>{});deferredPrompt=null;$('#installBtn').style.display='none';return}
  const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="card modal"><h2 style="font-size:24px">Install on iPhone</h2><ol class="mute" style="line-height:1.8;padding-left:20px"><li>Open this page in <b style="color:#fff">Safari</b></li><li>Tap the <b style="color:#fff">Share</b> button (square with arrow)</li><li>Choose <b style="color:#fff">Add to Home Screen</b></li></ol><button class="btn primary block" id="ok">Got it</button></div>`;document.body.appendChild(m);m.querySelector('#ok').onclick=()=>m.remove()};
addEventListener('appinstalled',()=>{$('#installBtn').style.display='none';toast('🚒 Installed!')});

paintHeader();go('home');
</script>
